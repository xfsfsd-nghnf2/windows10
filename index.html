<title>小型资源站</title>
<style>
  :root{
    --bg:#f6f7fb;
    --surface:#ffffff;
    --surface-2:#fafbfd;
    --border:#e6e8ef;
    --border-strong:#d6dae6;
    --text:#1a1d29;
    --text-2:#4b5162;
    --muted:#8a90a2;
    --accent:#4f46e5;
    --accent-hover:#4338ca;
    --accent-soft:#eef2ff;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    --shadow-lg:0 12px 40px rgba(16,24,40,.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  .container{width:100%;max-width:1180px;margin:0 auto;padding:0 24px;}

  /* ---------- Header ---------- */
  .site-header{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.82);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--border);
  }
  .header-inner{display:flex;align-items:center;gap:16px;height:64px;}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px;}
  .logo-mark{
    width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:16px;
    box-shadow:0 4px 12px rgba(99,102,241,.35);
  }
  .header-spacer{flex:1;}
  .header-actions{display:flex;align-items:center;gap:12px;}

  .header-note{font-size:13px;color:var(--muted);}
  .header-note b{color:var(--text);font-weight:650;}

  /* ---------- Hero ---------- */
  .hero{position:relative;padding:56px 0 32px;overflow:hidden;}
  .hero::before{
    content:"";position:absolute;top:-140px;right:-80px;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(99,102,241,.16),rgba(139,92,246,.06) 60%,transparent 70%);
  }
  .hero-inner{position:relative;display:flex;align-items:center;justify-content:space-between;gap:32px;}
  .hero-left{min-width:0;}
  .hero h1{
    margin:0 0 10px;font-size:34px;line-height:1.25;font-weight:750;letter-spacing:-.4px;
  }
  .hero h1 span{
    background:linear-gradient(120deg,#4f46e5,#8b5cf6 55%,#0ea5e9);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{margin:0;color:var(--muted);max-width:560px;}
  .stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:26px;}
  .stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.2px;}
  .stat span{font-size:13px;color:var(--muted);}

  /* ---------- 站长卡片 ---------- */
  .webmaster{
    flex-shrink:0;display:flex;align-items:center;gap:14px;
    padding:16px 22px;border-radius:16px;
    background:var(--surface);border:1px solid var(--border);
    box-shadow:var(--shadow-lg);
  }
  .webmaster .avatar{
    width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
    font-size:22px;font-weight:700;position:relative;flex-shrink:0;
  }
  .webmaster .avatar::after{
    content:"";position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;
    background:#22c55e;border:2.5px solid var(--surface);
  }
  .webmaster .wm-info{display:grid;gap:3px;}
  .webmaster .wm-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px;}
  .webmaster .wm-badge{
    font-size:11px;font-weight:600;color:var(--accent);
    background:var(--accent-soft);padding:2px 8px;border-radius:999px;letter-spacing:.5px;
  }
  .webmaster .wm-desc{font-size:12.5px;color:var(--muted);}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:26px 0 18px;}
  .search{
    position:relative;flex:1;min-width:240px;
  }
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);}
  .search input{
    width:100%;height:42px;padding:0 40px 0 38px;border-radius:11px;
    border:1px solid var(--border-strong);background:var(--surface);outline:none;transition:.16s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.13);}
  .search kbd{
    position:absolute;right:11px;top:50%;transform:translateY(-50%);
    font-size:11px;color:var(--muted);border:1px solid var(--border-strong);
    border-radius:5px;padding:1px 6px;background:var(--surface-2);font-family:inherit;
  }
  select.sort{
    height:42px;padding:0 12px;border-radius:11px;border:1px solid var(--border-strong);
    background:var(--surface);outline:none;cursor:pointer;
  }
  select.sort:focus{border-color:var(--accent);}

  /* ---------- Category chips ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
  .chip{
    padding:7px 14px;border-radius:999px;font-size:13.5px;
    border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);transition:.16s;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent);}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip.zero{opacity:.55;}
  .chip .count{opacity:.6;margin-left:5px;font-size:12px;}

  /* ---------- Grid ---------- */
  .grid{
    display:grid;gap:16px;padding-bottom:60px;
    grid-template-columns:repeat(auto-fill,minmax(272px,1fr));
  }
  .card{
    display:flex;flex-direction:column;gap:10px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);transition:.18s ease;position:relative;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--border-strong);}
  .card-top{display:flex;gap:12px;align-items:flex-start;}
  .icon{
    width:42px;height:42px;flex:none;border-radius:11px;display:grid;place-items:center;
    font-size:20px;background:var(--accent-soft);color:var(--accent);
  }
  .icon.type{
    font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .icon.img{background:#f4f5f9;padding:5px;}
  .icon.img img{width:100%;height:100%;object-fit:contain;border-radius:7px;display:block;}
  .more{margin-top:-2px;}
  .more summary{
    list-style:none;cursor:pointer;font-size:12.5px;color:var(--accent);
    display:inline-flex;align-items:center;gap:4px;padding:2px 0;user-select:none;
  }
  .more summary::-webkit-details-marker{display:none;}
  .more summary::before{content:"▸";font-size:10px;transition:.15s;}
  .more[open] summary::before{transform:rotate(90deg);}
  .more summary:hover{text-decoration:underline;}
  .more-list{display:grid;gap:4px;margin-top:8px;}
  .more-list a{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:12.5px;color:var(--text-2);padding:5px 9px;border-radius:8px;
    background:var(--surface-2);border:1px solid var(--border);transition:.14s;
  }
  .more-list a:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .more-list a em{font-style:normal;color:var(--muted);font-size:11.5px;flex:none;}
  .type-preview{
    display:flex;align-items:center;gap:9px;margin-top:9px;
    font-size:12.5px;color:var(--muted);
  }
  .type-preview .icon{width:34px;height:34px;border-radius:9px;}
  .card-title{font-weight:650;font-size:15.5px;line-height:1.4;word-break:break-word;}
  .card-cat{font-size:12px;color:var(--muted);margin-top:2px;}
  .card-desc{
    color:var(--text-2);font-size:13.5px;line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:1.6em;
  }
  .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{
    font-size:11.5px;padding:2px 8px;border-radius:6px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--muted);
  }
  .card-foot{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-top:auto;padding-top:12px;border-top:1px solid var(--border);
  }
  .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;}
  .card-actions{display:flex;gap:2px;}
  .icon-btn{
    width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:.15s;
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--accent);}

  /* ---------- Empty ---------- */
  .empty{
    grid-column:1/-1;text-align:center;padding:70px 20px;
    background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--radius);
  }
  .empty .e-icon{font-size:40px;}
  .empty h3{margin:12px 0 6px;font-size:17px;}
  .empty p{margin:0 0 18px;color:var(--muted);font-size:14px;}

  footer{
    border-top:1px solid var(--border);background:var(--surface);
    padding:22px 0;color:var(--muted);font-size:13px;
  }
  .foot-inner{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;}

  @media (max-width:640px){
    .hero{padding:36px 0 22px;}
    .hero h1{font-size:26px;}
    .hero-inner{flex-direction:column;align-items:flex-start;gap:18px;}
    .container{padding:0 16px;}
    .row2{grid-template-columns:1fr;}
    .hide-sm{display:none;}
  }
</style>
</head>

/* ============ 2. 数据层：只读页面内置的 SOFTWARE_SEED ============
   要增删资源，直接改上面的 SOFTWARE_SEED 数组即可（页面不提供在线录入） */
function normalize(r, i){
  return {
    id: r.id || ('r'+Date.now()+'_'+i),
    title: r.title || '未命名资源',
    desc: r.desc || '',
    category: r.category || '未分类',
    size: r.size || '',
    url: r.url || '',
    tags: Array.isArray(r.tags) ? r.tags : (r.tags ? String(r.tags).split(/[,，]/).map(s=>s.trim()).filter(Boolean) : []),
    icon: r.icon || '',
    detail: r.detail || '',
    more: Array.isArray(r.more) ? r.more.filter(m=>m && m.url) : [],
    date: r.date || new Date().toISOString().slice(0,10)
  };
}

let items = SOFTWARE_SEED.map(normalize);
let filterCat = '全部';
let keyword = '';

/* ============ 3. 工具 ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseSize(str){
  const m = String(str||'').match(/([\d.]+)\s*(B|KB|MB|GB|TB|K|M|G)?/i);
  if(!m) return 0;
  const n = parseFloat(m[1]);
  const u = (m[2]||'B').toUpperCase();
  const map = {B:1,K:1024,KB:1024,M:1048576,MB:1048576,G:1073741824,GB:1073741824,T:1099511627776,TB:1099511627776};
  return n * (map[u] || 1);
}
function fmtSize(bytes){
  if(!bytes) return '0 MB';
  const mb = bytes/1048576;
  if(mb < 1) return (bytes/1024).toFixed(1) + ' KB';
  if(mb < 1024) return mb.toFixed(1) + ' MB';
  return (mb/1024).toFixed(2) + ' GB';
}
/* ---- 文件类型识别：根据链接后缀自动给出图标 ---- */
const EXT_TYPES = {
  // 压缩包
  zip:['ZIP','#b45309','#fef3c7'], rar:['RAR','#b45309','#fef3c7'], '7z':['7Z','#b45309','#fef3c7'],
  tar:['TAR','#b45309','#fef3c7'], gz:['GZ','#b45309','#fef3c7'],
  // 文档
  pdf:['PDF','#b91c1c','#fee2e2'],
  doc:['DOC','#1d4ed8','#dbeafe'], docx:['DOC','#1d4ed8','#dbeafe'],
  ppt:['PPT','#c2410c','#ffedd5'], pptx:['PPT','#c2410c','#ffedd5'],
  xls:['XLS','#15803d','#dcfce7'], xlsx:['XLS','#15803d','#dcfce7'],
  md:['MD','#475569','#e2e8f0'],  txt:['TXT','#475569','#e2e8f0'],
  // 设计
  psd:['PSD','#4338ca','#e0e7ff'], ai:['AI','#9a3412','#ffedd5'],
  fig:['FIG','#7e22ce','#f3e8ff'], sketch:['SKT','#a21caf','#fae8ff'],
  xd:['XD','#be185d','#fce7f3'], cdr:['CDR','#0e7490','#cffafe'],
  // 图片 / 音视频
  png:['IMG','#0e7490','#cffafe'], jpg:['IMG','#0e7490','#cffafe'], jpeg:['IMG','#0e7490','#cffafe'],
  gif:['GIF','#0e7490','#cffafe'], webp:['IMG','#0e7490','#cffafe'], svg:['SVG','#0e7490','#cffafe'],
  mp4:['MP4','#be123c','#ffe4e6'], mov:['MOV','#be123c','#ffe4e6'],
  avi:['AVI','#be123c','#ffe4e6'], mkv:['MKV','#be123c','#ffe4e6'],
  mp3:['MP3','#0f766e','#ccfbf1'], wav:['WAV','#0f766e','#ccfbf1'], flac:['FLAC','#0f766e','#ccfbf1'],
  // 代码 / 字体 / 安装包
  js:['JS','#4d7c0f','#ecfccb'], ts:['TS','#1d4ed8','#dbeafe'], py:['PY','#4d7c0f','#ecfccb'],
  json:['JSON','#4d7c0f','#ecfccb'], html:['HTML','#c2410c','#ffedd5'], css:['CSS','#1d4ed8','#dbeafe'],
  ttf:['FONT','#a16207','#fef9c3'], otf:['FONT','#a16207','#fef9c3'], woff:['FONT','#a16207','#fef9c3'],
  woff2:['FONT','#a16207','#fef9c3'],
  exe:['EXE','#475569','#e2e8f0'], dmg:['DMG','#475569','#e2e8f0'],
  apk:['APK','#15803d','#dcfce7'], iso:['ISO','#475569','#e2e8f0']
};
const LINK_TYPE = ['LINK','#4f46e5','#eef2ff'];
const DEF_TYPE  = ['FILE','#6b7280','#f1f3f7'];

function fileType(url){
  if(!url) return {label:'FILE', fg:DEF_TYPE[1], bg:DEF_TYPE[2]};
  let s = String(url).split(/[?#]/)[0];
  const name = s.split('/').pop() || '';
  const dot = name.lastIndexOf('.');
  const ext = dot > 0 ? name.slice(dot+1).toLowerCase() : '';
  if(!ext || ext.length > 5) return {label:LINK_TYPE[0], fg:LINK_TYPE[1], bg:LINK_TYPE[2]};
  const t = EXT_TYPES[ext];
  if(t) return {label:t[0], fg:t[1], bg:t[2]};
  return {label:ext.slice(0,4), fg:DEF_TYPE[1], bg:DEF_TYPE[2]};
}
function isImgIcon(s){ return /^(https?:\/\/|data:image|\.{0,2}\/)/i.test(String(s||'').trim()); }
function iconHTML(i){
  if(isImgIcon(i.icon)){
    return '<div class="icon img"><img src="'+esc(i.icon)+'" alt="" loading="lazy" referrerpolicy="no-referrer" '+
           'onerror="fallbackIcon(this,'+esc(JSON.stringify(i.title||''))+')"></div>';
  }
  if(i.icon) return '<div class="icon">' + esc(i.icon) + '</div>';
  const t = fileType(i.url);
  return '<div class="icon type" style="background:'+t.bg+';color:'+t.fg+'">' + esc(t.label) + '</div>';
}
function fallbackIcon(img, title){
  const box = img.parentNode;
  if(!box) return;
  box.className = 'icon';
  box.textContent = String(title||'?').trim().charAt(0).toUpperCase();
}

/* ============ 4. 渲染 ============ */
/* 分区顺序：写死的排在前面（即使暂时没有资源也显示），数据里出现的新分类自动追加在后面 */
const CATEGORY_ORDER = ['系统工具', '教学软件', '教学辅助', '其他工具', '图吧工具箱'];

function render(){
  const inData = Array.from(new Set(items.map(i=>i.category)));
  const extra  = inData.filter(c=>CATEGORY_ORDER.indexOf(c) === -1);
  const cats   = ['全部'].concat(CATEGORY_ORDER, extra);

  const chipsHTML = cats.map(c=>{
    const n = c==='全部' ? items.length : items.filter(i=>i.category===c).length;
    return '<button class="chip'+(c===filterCat?' active':'')+(n===0?' zero':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'<span class="count">'+n+'</span></button>';
  }).join('');
  $('#chips').innerHTML = chipsHTML;

  const kw = keyword.trim().toLowerCase();
  let list = items.filter(i=>{
    if(filterCat!=='全部' && i.category!==filterCat) return false;
    if(!kw) return true;
    return (i.title+' '+i.desc+' '+i.category+' '+i.tags.join(' ')).toLowerCase().includes(kw);
  });

  const s = $('#sort').value;
  list.sort((a,b)=>{
    if(s==='name') return a.title.localeCompare(b.title,'zh');
    if(s==='size') return parseSize(b.size)-parseSize(a.size);
    if(s==='cat')  return a.category.localeCompare(b.category,'zh') || a.title.localeCompare(b.title,'zh');
    return (b.date||'').localeCompare(a.date||'');
  });

  $('#grid').innerHTML = list.length ? list.map(cardHTML).join('') : emptyHTML();
  bindCards();

  $('#headCount').textContent = items.length;
  $('#statTotal').textContent = items.length;
  $('#statCat').textContent = new Set(items.map(i=>i.category)).size;
}

function cardHTML(i){
  return '<article class="card" data-id="'+i.id+'">'+
    '<div class="card-top">'+
      iconHTML(i)+
      '<div style="min-width:0">'+
        '<div class="card-title" title="'+esc(i.detail || i.desc || i.title)+'">'+esc(i.title)+'</div>'+
        '<div class="card-cat">'+esc(i.category)+(i.size?' · '+esc(i.size):'')+'</div>'+
      '</div>'+
    '</div>'+
    (i.desc ? '<p class="card-desc">'+esc(i.desc)+'</p>' : '')+
    (i.tags.length ? '<div class="tags">'+i.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>' : '')+
    moreHTML(i)+
    '<div class="card-foot">'+
      '<div class="meta"><span>'+esc(i.date||'')+'</span></div>'+
      '<div class="card-actions">'+
        '<a class="icon-btn" title="打开 / 下载" href="'+esc(i.url||'#')+'" target="_blank" rel="noopener">'+
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>'+
        '</a>'+
      '</div>'+
    '</div>'+
  '</article>';
}

function moreHTML(i){
  const list = i.more || [];
  if(!list.length) return '';
  return '<details class="more"><summary>更多链接（'+list.length+'）</summary><div class="more-list">'+
    list.map(m=>'<a href="'+esc(m.url)+'" target="_blank" rel="noopener" title="'+esc(m.note||m.label||'')+'">'+
      '<span>'+esc(m.label||'链接')+'</span>'+(m.size?'<em>'+esc(m.size)+'</em>':'')+'</a>').join('')+
  '</div></details>';
}

function emptyHTML(){
  return '<div class="empty">'+
    '<div class="e-icon">🗂️</div>'+
    '<h3>'+(keyword ? '没找到匹配的资源' : (filterCat==='全部' ? '还没有任何资源' : '「'+esc(filterCat)+'」分区暂无资源'))+'</h3>'+
    '<p>'+(keyword ? '换个关键词，或者切回「全部」分类看看' : '资源清单由站点维护者更新')+'</p>'+
  '</div>';
}

function bindCards(){
  document.querySelectorAll("#chips .chip").forEach(function(c){
    c.onclick = function(){ filterCat = c.dataset.cat; render(); };
  });
}

/* ============ 5. 事件绑定 ============ */
$("#search").oninput = e=>{ keyword = e.target.value; render(); };
$("#sort").onchange  = render;

document.addEventListener("keydown", e=>{
  if(e.key==="/" && document.activeElement.tagName!=="INPUT" && document.activeElement.tagName!=="TEXTAREA"){
    e.preventDefault(); $("#search").focus();
  }
});

render();
</script>
